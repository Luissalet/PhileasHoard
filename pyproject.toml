[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phileas-hoard"
version = "0.1.0"
description = "A local shipment tracker: reads shipping mail, follows each parcel with its carrier and estimates the arrival day, with a dashboard, notifications and MCP tools."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Luissalet" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "httpx>=0.27",
  "mcp>=1.10,<2",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
browser = ["playwright>=1.45"]
windows = ["winotify>=1.1"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
icon = ["pillow>=11", "numpy>=2"]

[project.scripts]
phileas-hoard = "phileas_hoard.__main__:main"

[tool.setuptools.packages.find]
include = ["phileas_hoard*"]

[tool.setuptools.package-data]
phileas_hoard = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning", "ignore::FutureWarning"]
